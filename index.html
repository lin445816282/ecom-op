<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电商运营工作台</title>
  <link rel="stylesheet" href="style.css?v=20261003g">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">营</div>
        <div>电商运营工作台<small>PDD · 单品起店 · ROI</small></div>
      </div>
      <button class="nav-item active" data-view="autopublish"><span class="ico">🚀</span>一键上架</button>
      <button class="nav-item" data-view="dashboard"><span class="ico">▦</span>运营总览1</button>
      <button class="nav-item" data-view="packing"><span class="ico">🖨</span>打单登记</button>
      <div class="nav-group" id="nav-group-guide">
        <div class="nav-item nav-parent" data-group="guide"><span class="ico">📚</span><span class="nav-label">运营指南</span><span class="nav-arrow">▾</span></div>
        <div class="nav-sub" id="nav-sub-guide" hidden></div>
      </div>
      <button class="nav-item" data-view="products"><span class="ico">✚</span>商品投产</button>
      <button class="nav-item" data-view="catalog"><span class="ico">📦</span>商品库</button>
      <button class="nav-item" data-view="freight"><span class="ico">🚚</span>运费结算</button>
      <button class="nav-item" data-view="competitors"><span class="ico">🔍</span>竞品监控</button>
      <button class="nav-item" data-view="titleopt"><span class="ico">✏️</span>标题优化</button>
      <button class="nav-item" data-view="suppliers"><span class="ico">🏭</span>供应商</button>
      <button class="nav-item" data-view="newoffer"><span class="ico">🆕</span>新品专区</button>
      <button class="nav-item" data-view="keywords"><span class="ico">⌘</span>关键词库</button>
      <button class="nav-item" data-view="tasks"><span class="ico">✔</span>SOP 任务</button>
      <button class="nav-item" data-view="scheduler"><span class="ico">⏰</span>任务调度</button>
      <button class="nav-item" data-view="reviews"><span class="ico">⭐</span>评价监控</button>
      <button class="nav-item" data-view="logs"><span class="ico">◷</span>运营日志</button>
      <button class="nav-item" data-view="errors"><span class="ico">⚠️</span>错误处理</button>
      <button class="nav-item" data-view="publishedgoods"><span class="ico">📋</span>上架列表</button>
      <button class="nav-item" data-view="aiboss"><span class="ico">🤖</span>AI老板</button>
      <button class="nav-item" data-view="promofinance"><span class="ico">💰</span>推广财务</button>
      <button class="nav-item" data-view="profit"><span class="ico">📊</span>盈利看板</button>
      <button class="nav-item" data-view="sale"><span class="ico">📈</span>销售看板</button>
      <button class="nav-item" data-view="useradmin" data-admin-only="1"><span class="ico">👥</span>用户与权限</button>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="page-title">运营总览</h1>
          <p class="subtitle" id="page-subtitle">把资料里的经验，变成每天可执行的运营动作。</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="pill" id="shop-pill">
            <button class="shop-btn active" data-shop="拼多多">拼多多</button>
            <button class="shop-btn" data-shop="淘宝">淘宝</button>
          </div>
          <div class="pill" id="date-pill"></div>
          <div class="pill" id="user-pill" style="display:flex;align-items:center;gap:8px">
            <span id="current-user" style="font-weight:600;color:#17203a"></span>
            <button class="logout-btn" id="logout-btn">退出登录</button>
          </div>
        </div>
      </div>

      <div id="view-dashboard" class="view"></div>
      <div id="view-guidehub" class="view" hidden></div>
      <div id="view-guide" class="view" hidden></div>
      <div id="view-products" class="view" hidden></div>
      <div id="view-catalog" class="view" hidden></div>
      <div id="view-freight" class="view" hidden></div>
      <div id="view-competitors" class="view" hidden></div>
      <div id="view-titleopt" class="view" hidden></div>
      <div id="view-suppliers" class="view" hidden></div>
      <div id="view-knowledge" class="view" hidden></div>
      <div id="view-calendar" class="view" hidden></div>
      <div id="view-keywords" class="view" hidden></div>
      <div id="view-tasks" class="view" hidden></div>
      <div id="view-scheduler" class="view" hidden></div>
      <div id="view-reviews" class="view" hidden></div>
      <div id="view-douyin" class="view" hidden></div>
      <div id="view-logs" class="view" hidden></div>
      <div id="view-errors" class="view" hidden></div>
      <div id="view-autopublish" class="view" hidden></div>
      <div id="view-publishedgoods" class="view" hidden></div>
      <div id="view-packing" class="view" hidden></div>
      <div id="view-promofinance" class="view" hidden></div>
      <div id="view-profit" class="view" hidden></div>
      <div id="view-sale" class="view" hidden></div>
      <div id="view-aiboss" class="view" hidden></div>
      <div id="view-useradmin" class="view" hidden></div>
      <div id="view-newoffer" class="view" hidden></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="app.js?v=20261006f"></script>
</body>
</html>
